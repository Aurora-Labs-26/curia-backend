# ─────────────────────────────────────────────────────────────────────────────
# Curia local dev stack — postgres + api + worker.
#
# Bring it up:    docker compose up --build
# Run migrations: docker compose exec api alembic upgrade head
# Provision user: docker compose exec api python scripts/create_user.py --email you@example.com
# Tail logs:      docker compose logs -f api worker
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Postgres + pgvector ────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: curia-postgres-v3
    environment:
      POSTGRES_USER: curia
      POSTGRES_PASSWORD: curia
      POSTGRES_DB: curia
    ports:
      - "5433:5432"
    volumes:
      - curia-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U curia -d curia"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── FastAPI service ────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: curia-api-v3
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://curia:curia@postgres:5432/curia
      CURIA_AUDIO_DIR: /app/data/audio
      CURIA_ENV: ${CURIA_ENV:-dev}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      HUME_API_KEY: ${HUME_API_KEY:-}
      HUME_SECRET_KEY: ${HUME_SECRET_KEY:-}
      WEATHERAPI_KEY: ${WEATHERAPI_KEY:-}
      # Docker Desktop presents a public IP as the peer locally, so IP geo
      # returns junk — pin a city for dev. Unset in prod (see brief/geo.py).
      BRIEF_GEO_OVERRIDE_CITY: ${BRIEF_GEO_OVERRIDE_CITY:-Bengaluru}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      # Real path inside the mounted source tree — the whole repo is bind-mounted
      # at /app below, so a separate file mount inside it isn't possible.
      GOOGLE_APPLICATION_CREDENTIALS: /app/aurora-labs-73eca-firebase-adminsdk-fbsvc-0e9f5d765f.json
    volumes:
      # Local dev: mount the source tree so code/migration edits apply on
      # restart instead of needing an image rebuild.
      - .:/app
    ports:
      - "8001:8000"

  # ── Worker (same image, different command) ─────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: curia-worker-v3
    command: python -m worker.main
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://curia:curia@postgres:5432/curia
      CURIA_AUDIO_DIR: /app/data/audio
      CURIA_ENV: ${CURIA_ENV:-dev}
      CURIA_WORKER_POLL_SECONDS: ${CURIA_WORKER_POLL_SECONDS:-2}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      HUME_API_KEY: ${HUME_API_KEY:-}
      HUME_SECRET_KEY: ${HUME_SECRET_KEY:-}
      WEATHERAPI_KEY: ${WEATHERAPI_KEY:-}
    volumes:
      - .:/app

volumes:
  curia-pgdata:
