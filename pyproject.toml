[project]
name = "curia"
version = "0.1.0"
description = "Curia — turn a personal reading archive into original podcast episodes."
requires-python = ">=3.10"
readme = "README.md"

dependencies = [
    # LLM
    "anthropic>=0.40",
    "dspy-ai>=2.6",                  # DSPy + GEPA + MIPRO
    # Pipeline support
    "langgraph>=0.2",
    "trafilatura>=2.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    # DB
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "alembic>=1.13",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",          # sync driver alembic + sqlalchemy use; asyncpg covers app-side
    # Misc
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "pydub>=0.25",
    "audioop-lts>=0.2; python_version >= '3.13'",   # Python 3.13 dropped stdlib audioop; pydub needs it
    "pyyaml>=6.0",
    "jinja2>=3.1",                   # rubric template rendering
    "typer>=0.12",                   # onboarding CLI structure
    "firebase-admin>=6.5",           # Firebase Auth token verification
    "pyjwt[crypto]>=2.8",            # sign Apple "Sign in with Apple" client-secret (ES256)
    "boto3>=1.34",                   # R2/S3 audio upload + presigned URLs
    "uvicorn>=0.47.0",
    "hume>=0.7",
    "smallestai>=1.0",
    "apscheduler>=3.10",             # cron scheduling for push notifications
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Active packages only — the open-notebook fork legacy was deleted in the Tier-F cleanup.
packages = ["core", "intelligence", "studio", "api", "worker", "optimization"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:langgraph.*",
    "ignore::DeprecationWarning:pydantic.*",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
