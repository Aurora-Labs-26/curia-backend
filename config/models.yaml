# config/models.yaml
# ============================================================================
# Single source of truth for every model interaction in Curia:
#   - LLMs (Anthropic Claude, future OpenAI/Cohere/etc.)
#   - Embeddings (Voyage)
#   - TTS (ElevenLabs)
#
# Edit this file to:
#   * Switch a task to a different model
#   * Override per-environment (dev/staging/prod)
#   * Override per-show
#   * Configure per-speaker voices
#   * Add new providers/models without changing any Python
#
# Loaded once at import via core/llm_config/loader.py.
# See config/README.md for the field reference.
# ============================================================================


# ─────────────────────────────────────────────────────────────────────────────
# providers
# ─────────────────────────────────────────────────────────────────────────────
providers:
  anthropic:
    type: anthropic
    api_key_env: ANTHROPIC_API_KEY

  voyage:
    type: voyage
    api_key_env: VOYAGE_API_KEY
    base_url: https://api.voyageai.com/v1

  elevenlabs:
    type: elevenlabs
    api_key_env: ELEVENLABS_API_KEY
    base_url: https://api.elevenlabs.io/v1

  edge_tts:
    type: edge_tts
    api_key_env: EDGE_TTS_API_KEY   # unused — edge_tts needs no key; field required by schema

  smallest:
    type: smallest
    api_key_env: SMALLEST_API_KEY
    base_url: https://api.smallest.ai

  hume:
    type: hume
    api_key_env: HUME_API_KEY
    base_url: https://api.hume.ai

  deepgram:
    type: deepgram
    api_key_env: DEEPGRAM_API_KEY
    base_url: https://api.deepgram.com

  sarvam:
    type: sarvam
    api_key_env: SARVAM_API_KEY
    base_url: https://api.sarvam.ai

  cartesia:
    type: cartesia
    api_key_env: CARTESIA_API_KEY
    base_url: https://api.cartesia.ai

  # ── LLM providers ───────────────────────────────────────────────────────────
  #
  # vllm:
  #   type: vllm
  #   api_key_env: VLLM_API_KEY          # can be "dummy" for local
  #   base_url: http://localhost:8001/v1
  #
  # xai_llm:
  #   type: xai_llm
  #   api_key_env: XAI_API_KEY
  #   base_url: https://api.x.ai/v1
  #
  # gemini:
  #   type: gemini
  #   api_key_env: GEMINI_API_KEY
  #
  # openrouter:
  #   type: openrouter
  #   api_key_env: OPENROUTER_API_KEY
  #   base_url: https://openrouter.ai/api/v1

  # ── Embedding providers ────────────────────────────────────────────────────
  #
  openai_llm:
    type: openai
    api_key_env: OPENAI_API_KEY

  openai_embed:
    type: openai
    api_key_env: OPENAI_API_KEY
    base_url: https://api.openai.com/v1
  #
  # cohere_embed:
  #   type: cohere
  #   api_key_env: COHERE_API_KEY
  #   base_url: https://api.cohere.com/v2
  #
  # jina:
  #   type: jina
  #   api_key_env: JINA_API_KEY
  #   base_url: https://api.jina.ai/v1
  #
  # mistral:
  #   type: mistral
  #   api_key_env: MISTRAL_API_KEY
  #   base_url: https://api.mistral.ai/v1
  #
  # gemini_embed:
  #   type: gemini
  #   api_key_env: GEMINI_API_KEY
  #   base_url: https://generativelanguage.googleapis.com/v1beta

  # ── TTS providers ──────────────────────────────────────────────────────────
  #
  # google_tts:
  #   type: google_tts
  #   api_key_env: GOOGLE_TTS_API_KEY
  #   base_url: https://texttospeech.googleapis.com/v1
  #
  # xai_tts:
  #   type: xai
  #   api_key_env: XAI_API_KEY
  #   base_url: https://api.x.ai/v1
