  #   # When they do, set settings.endpoint_path on the model alias below.
  #
  # openai_tts:
  #   type: openai_tts
  #   api_key_env: OPENAI_API_KEY
  #   base_url: https://api.openai.com/v1
  #
  # (cartesia moved to the active TTS providers above)


# ─────────────────────────────────────────────────────────────────────────────
# models — named aliases used by bindings
# ─────────────────────────────────────────────────────────────────────────────
models:
  haiku-4-5:
    provider: anthropic
    model_id: claude-haiku-4-5-20251001
    kind: llm
    defaults:
      max_tokens: 4096
      temperature: 0.7

  sonnet-4-6:
    provider: anthropic
    model_id: claude-sonnet-4-6
    kind: llm
    defaults:
      max_tokens: 16000
      temperature: 0.9

  gpt-4o-mini:
    provider: openai_llm
    model_id: gpt-4o-mini
    kind: llm
    defaults:
      max_tokens: 4096
      temperature: 0.7

  gpt-4o:
    provider: openai_llm
    model_id: gpt-4o
    kind: llm
    defaults:
      max_tokens: 8192
      temperature: 0.9

  voyage-3:
    provider: voyage
    model_id: voyage-3
    kind: embedding
    dimension: 1024

  voyage-3-lite:
    provider: voyage
    model_id: voyage-3-lite
    kind: embedding
    dimension: 512

  eleven-multi-v2:
    provider: elevenlabs
    model_id: eleven_multilingual_v2
    kind: tts
    defaults:
      output_format: pcm_22050
      stability: 0.5
      similarity_boost: 0.75

  edge-tts:
    provider: edge_tts
    model_id: edge_tts
    kind: tts

  smallest-lightning:
    provider: smallest
    model_id: lightning
    kind: tts
    defaults:
      sample_rate: 24000
      speed: 1.0
      language: en

  hume-octave:
    provider: hume
    model_id: octave
    kind: tts
    defaults:
      output_format: mp3

  # Deepgram Aura — the Deepgram "voice" is the model query param (aura-2-*-en).
  # Per-speaker voice_id overrides model_id below; set bit_rate to tune MP3 quality.
  deepgram-aura:
    provider: deepgram
    model_id: aura-2-thalia-en
    kind: tts
    defaults:
      bit_rate: 48000

  # ── Additional LLM model aliases ───────────────────────────────────────────
