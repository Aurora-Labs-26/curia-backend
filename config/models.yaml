  cartesia-sonic:
    provider: cartesia
    model_id: sonic-2
    kind: tts
    defaults:
      sample_rate: 22050

  sarvam-bulbul:
    provider: sarvam
    model_id: bulbul:v2
    kind: tts
    defaults:
      target_language_code: en-IN
      sample_rate: 22050
      max_chars: 450


# ─────────────────────────────────────────────────────────────────────────────
# bindings — what model each task uses, in which scope
# Resolution order (most specific wins):
#   user → cohort → show → environment → task default → error
# ─────────────────────────────────────────────────────────────────────────────
bindings:

  # Default per-task — used unless a more specific scope matches
  task:
    transformation.summary:        haiku-4-5
    transformation.metadata:       haiku-4-5
    transformation.key_insights:   haiku-4-5
    transformation.human_stakes:   haiku-4-5
    transformation.core_tensions:  haiku-4-5
    transformation.counterpoints:  haiku-4-5
    transformation.examples:       haiku-4-5

    classify.topics:         haiku-4-5

    idea_evaluation.batch:   haiku-4-5
    idea_evaluation.single:  haiku-4-5

    outline:    haiku-4-5
    transcript: sonnet-4-6

    embedding:  text-embedding-3-small

    # Future-reserved — these are noted now so the YAML is forward-compatible
    judge:              sonnet-4-6
    rubric_generator:   sonnet-4-6
    gepa_reflection:    sonnet-4-6

  # Per-environment overrides (CURIA_ENV=dev|staging|prod)
  environment:
    dev:
      transcript: haiku-4-5    # cheaper in dev — overrides task default
    prod:
      transcript: sonnet-4-6

  # Per-show overrides — replaces studio/shows/profiles.py outline_llm/transcript_llm
  show:
    narrative_drift:
      outline:    haiku-4-5
      transcript: sonnet-4-6
    clarity_engine:
      outline:    haiku-4-5
      transcript: sonnet-4-6
    momentum_loop:
      outline:    haiku-4-5
      transcript: sonnet-4-6
    exploration_engine:
      outline:    haiku-4-5
      transcript: sonnet-4-6

  # Per-speaker TTS — model alias + voice_id
  # Default: Smallest.ai lightning-v3.1 (william/alec/julia)
  # Hume config kept below — swap in when credits are available (word-level timestamps).
  speaker:
    kenji:
      model: smallest-lightning
      voice_id: william
    arjun:
      model: smallest-lightning
      voice_id: zorin
    emeka:
      model: smallest-lightning
      voice_id: vanessa

  # ── Hume (premium, word-level timestamps) ─────────────────────────────────
  # Uncomment and comment out Smallest.ai above to switch back to Hume.
  # speaker:
  #   kenji:
  #     model: hume-octave
  #     voice_id: Ito
  #   arjun:
  #     model: hume-octave
  #     voice_id: Arjun
  #   emeka:
  #     model: hume-octave
  #     voice_id: Vince Douglas

  # ── Example: switching providers ──────────────────────────────────────────
  # task:
  #   transcript: grok-3                  # xAI Grok for transcripts
  #   outline: gemini-2.5-flash           # Gemini Flash for outlines
  #   embedding: text-embedding-3-small   # OpenAI embeddings
  #   embedding: jina-embeddings-v3       # or Jina embeddings
  #
  # speaker:
  #   kenji:
  #     model: openai-tts-1-hd
  #     voice_id: onyx
  #   arjun:
  #     model: cartesia-sonic
  #     voice_id: <cartesia-voice-uuid>
  #   emeka:
  #     model: sarvam-bulbul
  #     voice_id: anushka            # Sarvam named speaker; set
  #                                  # target_language_code (e.g. hi-IN) via
  #                                  # the model alias defaults for Indian languages

  # Reserved for later (cohort + user scopes — empty for v1)
  cohort: {}
  user: {}
